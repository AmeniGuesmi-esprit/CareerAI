server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Application Angular (routage côté navigateur) : toute URL inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers avec empreinte dans le nom : mis en cache longtemps
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
