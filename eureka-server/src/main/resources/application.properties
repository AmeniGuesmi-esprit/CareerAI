server.port=8761
spring.application.name=eureka-server

# Identifiants Eureka (à reporter dans defaultZone des clients)
spring.security.user.name=${EUREKA_USER:admin}
spring.security.user.password=${EUREKA_PASSWORD:admin123}

# Serveur autonome : ne s'enregistre pas auprès de lui-même
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.hostname=localhost
eureka.server.enable-self-preservation=false
