services:
  # ========================= INFRASTRUCTURE =========================

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"          # si XAMPP/MySQL tourne déjà en local : "3307:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro   # crée les bases des services
    networks:
      - careerai-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ========================= EUREKA =========================

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      EUREKA_USER: ${EUREKA_USER:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
    networks:
      - careerai-net
    healthcheck:
      # Eureka est protégé par Spring Security (pas d'Actuator) : on teste /eureka/apps avec les identifiants
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -u \"$$EUREKA_USER:$$EUREKA_PASSWORD\" http://localhost:8761/eureka/apps || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # ========================= API GATEWAY =========================

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8222:8222"          # seul point d'entrée pour le frontend Angular (http://localhost:8222)
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-admin}:${EUREKA_PASSWORD:-admin123}@eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant, copiez .env.example vers .env}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - careerai-net
    restart: unless-stopped

  # ========================= USER SERVICE =========================

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"          # optionnel : utile pour tester sans passer par la gateway
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/careerai_users?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-admin}:${EUREKA_PASSWORD:-admin123}@eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant, copiez .env.example vers .env}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME manquant}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD manquant}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL manquant}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD manquant}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - careerai-net
    restart: unless-stopped

  # ========================= COMPATIBILITY SERVICE =========================

  compatibility-service:
    build:
      context: ./compatibility-service
      dockerfile: Dockerfile
    container_name: compatibility-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/compatibility_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-admin}:${EUREKA_PASSWORD:-admin123}@eureka-server:8761/eureka/
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - careerai-net
    restart: unless-stopped

  # ========================= INTERVIEW SERVICE =========================

  interview-service:
    build:
      context: ./interview-service
      dockerfile: Dockerfile
    container_name: interview-service
    # Pas de port publié : l'accès passe uniquement par l'API Gateway
    environment:
      INTERVIEW_DB_URL: jdbc:mysql://mysql:3306/interview_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-admin}:${EUREKA_PASSWORD:-admin123}@eureka-server:8761/eureka/
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RAG_KNOWLEDGE_PATH: /app/knowledge
    volumes:
      - ./knowledge:/app/knowledge:ro   # base de connaissances versionnée (indexée par POST /api/interview/admin/rag/reindex)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Ollama installé sur l'hôte Windows
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - careerai-net
    restart: unless-stopped

  # ========================= OLLAMA (optionnel) =========================
  # Activer avec : docker compose --profile ollama-docker up -d
  # Sinon, Ollama de l'hôte est utilisé via OLLAMA_BASE_URL.

  ollama:
    image: ollama/ollama:0.21.2
    container_name: ollama
    profiles: ["ollama-docker"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - careerai-net
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:0.21.2
    profiles: ["ollama-docker"]
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    # Télécharge les modèles épinglés (identiques à scripts/ollama-pull.ps1)
    entrypoint: ["sh", "-c", "ollama pull qwen3.5:4b && ollama pull bge-m3"]
    networks:
      - careerai-net

networks:
  careerai-net:
    driver: bridge

volumes:
  mysql_data:
  ollama_data:
