# Lancement : docker compose up --build   →   application sur http://localhost:4200
# Les variables obligatoires (JWT_SECRET, LLM_API_KEY, GEMINI_API_KEY, MAIL_*, ADMIN_*) sont lues dans les variables
# d'environnement du PC ou dans un fichier .env à côté de ce fichier (voir .env.example).
# Arrêtez d'abord les services lancés en local : les ports 8761, 8222 et 4200 doivent être libres.

services:
  # ========================= INFRASTRUCTURE =========================

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3307:3306"          # 3307 côté PC : le 3306 est souvent pris par XAMPP (les services utilisent mysql:3306)
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro   # crée les bases des services
    networks:
      - careerai-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # LLM local partagé (compatibility-service + interview-service). Version épinglée : les
  # vieilles versions refusent les modèles récents des registres Ollama.
  ollama:
    image: ollama/ollama:0.40.4
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama   # conserve les modèles téléchargés
    networks:
      - careerai-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # GPU NVIDIA sous Docker Desktop/WSL2 : ajouter sous "volumes" si votre PC en a un :
    #   deploy.resources.reservations.devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    restart: unless-stopped

  # Télécharge les modèles une seule fois, puis s'arrête (~4,7 Go qwen2.5, ~3,3 Go qwen3.5, ~1,2 Go bge-m3)
  ollama-pull:
    image: ollama/ollama:0.40.4
    container_name: ollama-pull
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen2.5:7b} && ollama pull qwen3.5:4b && ollama pull bge-m3"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - careerai-net
    restart: "no"

  # ========================= EUREKA =========================

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      EUREKA_USER: ${EUREKA_USER:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
    networks:
      - careerai-net
    healthcheck:
      # Eureka est protégé par Spring Security (pas d'Actuator) : on teste /eureka/apps avec les identifiants
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -u \"$$EUREKA_USER:$$EUREKA_PASSWORD\" http://localhost:8761/eureka/apps || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # ========================= API GATEWAY =========================

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8222:8222"          # seul point d'entrée pour le frontend Angular (http://localhost:8222)
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-admin}:${EUREKA_PASSWORD:-admin123}@eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant, copiez .env.example vers .env}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - careerai-net
    restart: unless-stopped

  # ========================= USER SERVICE =========================

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/careerai_users?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-admin}:${EUREKA_PASSWORD:-admin123}@eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant, copiez .env.example vers .env}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME manquant}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD manquant}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL manquant}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD manquant}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - careerai-net
    restart: unless-stopped

  # ========================= COMPETENCE SERVICE =========================

  competence-service:
    build:
      context: ./competence-service
      dockerfile: Dockerfile
    container_name: competence-service
    ports:
      - "8085:8085"          # optionnel : utile pour tester sans passer par la gateway
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/careerai_competences?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-admin}:${EUREKA_PASSWORD:-admin123}@eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant, copiez .env.example vers .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - careerai-net
    restart: unless-stopped

  # ========================= EXPERIENCE SERVICE =========================

  experience-service:
    build:
      context: ./experience-service
      dockerfile: Dockerfile
    container_name: experience-service
    ports:
      - "8090:8090"          # optionnel : utile pour tester sans passer par la gateway
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/careerai_experiences?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-admin}:${EUREKA_PASSWORD:-admin123}@eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant, copiez .env.example vers .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY manquant}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - careerai-net
    restart: unless-stopped

  # ========================= SKILL GAP SERVICE =========================

  skill-gap-service:
    build:
      context: ./skill-gap-service
      dockerfile: Dockerfile
    container_name: skill-gap-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/careerai_skillgap?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-admin}:${EUREKA_PASSWORD:-admin123}@eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant, copiez .env.example vers .env}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY manquant (cle Groq)}
      LLM_API_URL: ${LLM_API_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      HF_API_KEY: ${HF_API_KEY:-}                # RAG sémantique (Hugging Face) ; vide = recherche lexicale locale
      CV_STORAGE_DIR: /app/uploads
    volumes:
      - cv_uploads:/app/uploads      # conserve les CV importes
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - careerai-net
    restart: unless-stopped

  # ========================= COMPATIBILITY SERVICE =========================

  compatibility-service:
    build:
      context: ./compatibility-service
      dockerfile: Dockerfile
    container_name: compatibility-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/compatibility_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-admin}:${EUREKA_PASSWORD:-admin123}@eureka-server:8761/eureka/
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    networks:
      - careerai-net
    restart: unless-stopped

  # ========================= INTERVIEW SERVICE =========================

  interview-service:
    build:
      context: ./interview-service
      dockerfile: Dockerfile
    container_name: interview-service
    # Pas de port publié : l'accès passe uniquement par l'API Gateway
    environment:
      INTERVIEW_DB_URL: jdbc:mysql://mysql:3306/interview_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-admin}:${EUREKA_PASSWORD:-admin123}@eureka-server:8761/eureka/
      OLLAMA_BASE_URL: http://ollama:11434      # Ollama partagé (même conteneur que compatibility-service)
      RAG_KNOWLEDGE_PATH: /app/knowledge
    volumes:
      - ./knowledge:/app/knowledge:ro   # base de connaissances versionnée (indexée par POST /api/interview/admin/rag/reindex)
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully   # attend qwen3.5:4b et bge-m3
    networks:
      - careerai-net
    restart: unless-stopped

  # ========================= FRONTEND =========================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "4200:80"            # http://localhost:4200 (origine autorisée par le CORS de la gateway)
    depends_on:
      - api-gateway
    networks:
      - careerai-net
    restart: unless-stopped
    
networks:
  careerai-net:
    driver: bridge

volumes:
  mysql_data:
  cv_uploads:
  ollama_data: