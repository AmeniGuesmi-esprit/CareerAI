# ── Serveur ──
server.port=8095
spring.application.name=lettre-service

# ── MySQL / XAMPP ──
spring.datasource.url=jdbc:mysql://localhost:3306/careerai_lettre?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Eureka ──
eureka.client.service-url.defaultZone=http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin123}@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ── JWT (même secret que user-service et api-gateway, encodé en Base64) ──
app.jwt.secret=${JWT_SECRET:keujOyFNBRqHWgoEfycC1a/O8vloJYmQ0PFkbLuYaf4=}

# ── Upload du CV (PDF / DOCX / TXT) ──
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ── Assistant IA (génération / amélioration de lettres) ──
# Les clés ne vont JAMAIS dans ce fichier : variables d'environnement MISTRAL_API_KEY et COHERE_API_KEY.
app.llm.default-provider=${LLM_DEFAULT_PROVIDER:mistral}
app.llm.temperature=0.7
app.llm.max-tokens=1500
app.llm.timeout-seconds=60

app.llm.providers.mistral.url=https://api.mistral.ai/v1/chat/completions
app.llm.providers.mistral.api-key=${MISTRAL_API_KEY:mstrl_v0JhIQOam6GgxIZTuFPDRdsbablyNPkh_4D2Xkk}
app.llm.providers.mistral.model=${MISTRAL_MODEL:mistral-small-latest}

app.llm.providers.cohere.url=https://api.cohere.ai/compatibility/v1/chat/completions
app.llm.providers.cohere.api-key=${COHERE_API_KEY:cohere_wNVSGs2jJGdT1FSM2IypYQYU168e8st3WfKc71N42ptlXG}
app.llm.providers.cohere.model=${COHERE_MODEL:command-a-plus-05-2026}
