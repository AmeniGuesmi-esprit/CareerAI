# ── Serveur ──
server.port=8095
spring.application.name=lettre-service

# ── MySQL / XAMPP ──
spring.datasource.url=jdbc:mysql://localhost:3306/careerai_lettre?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Eureka ──
eureka.client.service-url.defaultZone=http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin123}@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ── JWT (même secret que user-service et api-gateway, encodé en Base64) ──
app.jwt.secret=${JWT_SECRET:}

# ── Upload du CV (PDF / DOCX / TXT) ──
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ── Assistant IA (génération / amélioration de lettres) ──
# Les clés ne vont JAMAIS dans ce fichier. Deux façons de les fournir (au choix) :
#   1) variables d'environnement : GEMINI_API_KEY, COHERE_API_KEY, MISTRAL_API_KEY
#   2) fichier src/main/resources/application-secrets.properties (non versionné, voir .gitignore)
spring.config.import=optional:classpath:application-secrets.properties
app.llm.default-provider=${LLM_DEFAULT_PROVIDER:gemini}
app.llm.temperature=0.7
app.llm.max-tokens=3000
app.llm.timeout-seconds=60

# Google Gemini (API compatible OpenAI) : gratuit via Google AI Studio
app.llm.providers.gemini.url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
app.llm.providers.gemini.api-key=${GEMINI_API_KEY:}
app.llm.providers.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.llm.providers.gemini.reasoning-effort=low

# Cohere (clé Trial) : modèle sans « réflexion » pour éviter les réponses coupées
app.llm.providers.cohere.url=https://api.cohere.ai/compatibility/v1/chat/completions
app.llm.providers.cohere.api-key=${COHERE_API_KEY:}
app.llm.providers.cohere.model=${COHERE_MODEL:command-a-03-2025}

# Mistral (plan gratuit très limité en requêtes par minute)
app.llm.providers.mistral.url=https://api.mistral.ai/v1/chat/completions
app.llm.providers.mistral.api-key=${MISTRAL_API_KEY:}
app.llm.providers.mistral.model=${MISTRAL_MODEL:mistral-small-latest}