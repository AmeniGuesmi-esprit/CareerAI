# ── Serveur ──
server.port=8082
spring.application.name=competence-service

# ── MySQL / XAMPP ──
spring.datasource.url=jdbc:mysql://localhost:3306/careerai_competences?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Eureka ──
eureka.client.service-url.defaultZone=http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin123}@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ?? JWT (M�ME secret Base64 que user-service et api-gateway) ??
app.jwt.secret=${JWT_SECRET:}

# -- Gemini (cle via variable d'environnement, jamais en dur) --
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
app.gemini.judge-enabled=true
app.gemini.rate-limit-per-minute=5

