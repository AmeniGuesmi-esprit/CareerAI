server:
  port: 8222

spring:
  application:
    name: api-gateway
  config:
    # JWT_SECRET lu dans le .env de la racine (lancement depuis la racine ou depuis ce dossier) ;
    # une vraie variable d'environnement reste prioritaire
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  cloud:
    loadbalancer:
      cache:
        ttl: 5s            # évite le cache d'une liste de serveurs vide (503)
    gateway:
      discovery:
        locator:
          enabled: false
      # CORS géré uniquement ici (pas dans les services)
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        - id: lettre-service
          uri: lb://lettre-service
          predicates:
            - Path=/api/lettres/**

        - id: skill-gap-service
          uri: lb://skill-gap-service
          predicates:
            - Path=/api/skill-gap/**

        - id: compatibility-service
          uri: lb://compatibility-service
          predicates:
            - Path=/api/compatibility/**

        - id: interview-service
          uri: lb://interview-service
          predicates:
            - Path=/api/interview/**

        - id: experience-service
          uri: lb://experience-service
          predicates:
            - Path=/api/experiences/**, /api/pitch/**

        - id: competence-service
          uri: lb://competence-service
          predicates:
            - Path=/api/formations/**, /api/competences/**, /api/orientation/**

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin123}@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:}