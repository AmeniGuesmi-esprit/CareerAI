# ===== Serveur =====
server.port=8082
spring.application.name=compatibility-service
# JWT_SECRET lu dans le .env de la racine (lancement depuis la racine ou depuis ce dossier) ; une vraie variable d'environnement reste prioritaire
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ===== Base de données =====
spring.datasource.url=jdbc:mysql://localhost:3306/compatibility_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=50

# ===== Upload =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== JWT (meme secret, en Base64, que user-service et api-gateway ; variable JWT_SECRET) =====
app.jwt.secret=${JWT_SECRET:}

# ===== Eureka =====
eureka.client.service-url.defaultZone=http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin123}@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ===== IA locale : Ollama (gratuit, sans cle d'API) =====
# Installer le modele une fois : ollama pull qwen2.5:7b
app.ai.model=${OLLAMA_MODEL:qwen2.5:7b}
app.ai.url=${OLLAMA_URL:http://localhost:11434}
# Un modele local est plus lent qu'une API cloud
app.ai.timeout-seconds=300
app.ai.num-ctx=8192
# Hyperparametres et version du prompt (valeurs retenues par ModelEvaluationTest, voir le README)
app.ai.temperature=${OLLAMA_TEMPERATURE:0.2}
app.ai.prompt-version=${OLLAMA_PROMPT_VERSION:v1}
# Cache des analyses identiques (meme modele, meme prompt, meme CV et offre anonymises) ; 0 = desactive
app.ai.cache.ttl-minutes=60
app.ai.cache.max-entries=200
