# ===== Serveur =====
server.port=8082
spring.application.name=compatibility-service

# ===== Base de données =====
spring.datasource.url=jdbc:mysql://localhost:3306/compatibility_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=50

# ===== Upload =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== Eureka =====
eureka.client.service-url.defaultZone=http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin123}@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ===== IA (la clé vient d'une variable d'environnement) =====
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=claude-sonnet-5-5
app.ai.url=https://api.anthropic.com/v1/messages
app.ai.timeout-seconds=30