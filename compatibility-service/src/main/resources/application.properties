# ===== Serveur =====
server.port=8082
spring.application.name=compatibility-service

# ===== Base de données =====
spring.datasource.url=jdbc:mysql://localhost:3306/compatibility_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=50

# ===== Upload =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== Eureka =====
eureka.client.service-url.defaultZone=http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin123}@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ===== IA locale : Ollama (gratuit, sans cle d'API) =====
# Installer le modele une fois : ollama pull qwen2.5:7b
app.ai.model=${OLLAMA_MODEL:qwen2.5:7b}
app.ai.url=${OLLAMA_URL:http://localhost:11434}
# Un modele local est plus lent qu'une API cloud
app.ai.timeout-seconds=300
app.ai.num-ctx=8192
