spring.application.name=compatibility-service
spring.datasource.url=jdbc:h2:mem:compatdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
app.ai.model=qwen-test
app.ai.url=http://127.0.0.1:1
app.ai.timeout-seconds=5
app.ai.num-ctx=4096
app.ai.cache.ttl-minutes=60
app.ai.cache.max-entries=200
