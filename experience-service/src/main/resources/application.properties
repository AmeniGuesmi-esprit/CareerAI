# -- Serveur --
server.port=8090
spring.application.name=experience-service

# -- MySQL / XAMPP (la base est creee automatiquement au premier demarrage) --
spring.datasource.url=jdbc:mysql://localhost:3306/careerai_experiences?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -- JPA --
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# -- Eureka --
eureka.client.service-url.defaultZone=http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin123}@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# -- JWT (meme secret que user-service et api-gateway) --
app.jwt.secret=${JWT_SECRET:#}

# -- Gemini (Google AI Studio) : la cle vient de la variable d'environnement GEMINI_API_KEY, jamais en dur --
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-3.5-flash-lite
gemini.connect-timeout-ms=5000
gemini.read-timeout-ms=120000
gemini.max-attempts=3
gemini.initial-backoff-ms=1000