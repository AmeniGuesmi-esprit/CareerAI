# -- Serveur --
server.port=8081
spring.application.name=user-service

# -- MySQL / XAMPP --
spring.datasource.url=jdbc:mysql://localhost:3306/careerai_users?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -- JPA --
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# -- Mail Gmail (MAIL_PASSWORD = mot de passe d'application de 16 caracteres, voir .env.example) --
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# -- Eureka --
eureka.client.service-url.defaultZone=http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin123}@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# -- JWT (meme secret que api-gateway, encode en Base64) --
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# -- Admin cree au premier demarrage --
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.nom=Admin
app.admin.prenom=CareerAI

# -- Frontend (liens des emails) --
app.frontend-url=http://localhost:4200