spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Eureka ──
eureka.client.service-url.defaultZone=http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin123}@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ── JWT (même secret que api-gateway, encodé en Base64) ──
