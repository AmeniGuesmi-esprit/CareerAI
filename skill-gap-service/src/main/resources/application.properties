# -- Serveur --
server.port=8084
spring.application.name=skill-gap-service

# -- MySQL / XAMPP --
spring.datasource.url=jdbc:mysql://localhost:3306/careerai_skillgap?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -- JPA --
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# -- Upload --
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
storage.dir=${CV_STORAGE_DIR:./uploads}

# -- Eureka --
eureka.client.service-url.defaultZone=http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin123}@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# -- JWT (meme secret que api-gateway et user-service, encode en Base64) --
app.jwt.secret=${JWT_SECRET}

# -- LLM : Groq (compatible OpenAI). La cle se definit UNIQUEMENT en variable d'environnement LLM_API_KEY --
llm.api-url=${LLM_API_URL:https://api.groq.com/openai/v1}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:openai/gpt-oss-120b}
llm.max-tokens=2500
# Reduit les jetons de raisonnement des modeles gpt-oss (vide = defaut du fournisseur)
llm.reasoning-effort=${LLM_REASONING_EFFORT:low}
llm.timeout-seconds=90

# Analyse : tailles max (caracteres) envoyees au LLM - limite Groq on_demand = 8000 jetons/min
analysis.max-cv-chars=9000

#  RAG
# Recherche semantique (optionnelle) : embeddings Hugging Face. Si HF_API_KEY est absente ou sans credits,
# le service bascule automatiquement sur une recherche lexicale locale (TF-IDF), sans cle ni reseau.
rag.hf-api-key=${HF_API_KEY:}
rag.embedding-base-url=${HF_BASE_URL:https://router.huggingface.co/hf-inference/models}
rag.embedding-model=${HF_EMBEDDING_MODEL:sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
rag.timeout-seconds=30
rag.top-k=5
rag.min-score=0.30
# Recherche lexicale : offre découpée en blocs plus courts (le TF-IDF se dilue sur un long texte), seuil calibré
# sur ces blocs (voir RagRetrievalTest)
rag.lexical-min-score=0.10
rag.lexical-chunk-chars=250
rag.chunk-chars=400
rag.context-max-chars=1800